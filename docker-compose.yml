services:
  db:
    image: postgres:16-alpine
    container_name: migrasi_demo_db
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: migrasi_demo
    # Port 5433 supaya nggak bentrok sama Postgres yang mungkin
    # sudah jalan di laptop kalian di port 5432.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d migrasi_demo"]
      interval: 2s
      timeout: 3s
      retries: 15
